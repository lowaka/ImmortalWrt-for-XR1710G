name: Sync Upstream (naoki66 + ImmortalWrt)

# 每次合并只做“拉取 + 合并 + 推送”，定制内容全部放在 custom/ 目录，
# 因此上游更新不会覆盖本仓库的插件清单、后台地址等定制。

on:
  schedule:
    - cron: '0 19 */3 * *'
  workflow_dispatch:
    inputs:
      trigger_build:
        description: '同步成功后是否自动触发固件构建'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  actions: write

concurrency:
  group: xr1710g-sync
  cancel-in-progress: false

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          # 冲突时保留本仓库版本（.gitattributes 中标记 merge=keep-ours 的文件使用该驱动）
          git config merge.keep-ours.name "keep our version on conflict"
          git config merge.keep-ours.driver true
          # 只在 CI 生效的属性文件：本仓库定制的 workflow 冲突时保留自己的版本。
          # 放在 .git/info/attributes（不进版本库），这样 .gitattributes 始终跟随上游、不再冲突。
          printf '%s\n' \
            '.github/workflows/build-firmware.yml merge=keep-ours' \
            '.github/workflows/sync-upstream.yml merge=keep-ours' \
            > .git/info/attributes

      - name: Add upstream remotes
        run: |
          git remote add parent https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git 2>/dev/null || true
          git remote set-url parent https://github.com/naoki66/ImmortalWrt-for-Gemtek-XR1710G.git
          git remote add upstream https://github.com/immortalwrt/immortalwrt.git 2>/dev/null || true
          git remote set-url upstream https://github.com/immortalwrt/immortalwrt.git

      - name: Fetch upstreams
        run: |
          git fetch --no-tags parent +refs/heads/master:refs/remotes/parent/master
          git fetch --no-tags upstream +refs/heads/master:refs/remotes/upstream/master

      - name: Merge updates
        id: merge
        run: |
          changed=false
          merged=""
          skipped=""
          for ref in parent/master upstream/master; do
            if git merge-base --is-ancestor "$ref" HEAD; then
              echo "== $ref：没有新提交，跳过"
              continue
            fi
            ahead="$(git rev-list --count HEAD.."$ref")"
            echo "== $ref：领先 HEAD ${ahead} 个提交，尝试合并"
            if git merge --no-edit "$ref"; then
              changed=true
              merged="$merged $ref"
              continue
            fi
            if [ "$ref" = "parent/master" ]; then
              echo "::error::合并 parent/master（naoki66）出现冲突，需要人工处理。冲突文件："
              git diff --name-only --diff-filter=U
              git merge --abort || true
              exit 1
            fi
            echo "::warning::合并 upstream/master（immortalwrt）出现冲突，已撤销本次合并并跳过；immortalwrt 由 naoki66 负责合并，本仓库只需跟随 naoki66 的树。冲突文件："
            git diff --name-only --diff-filter=U
            git merge --abort || true
            skipped="$skipped $ref"
          done
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "已合并：${merged:-无}；因冲突跳过：${skipped:-无}"

      - name: Check upstream workflow drift
        if: always()
        run: |
          recorded="$(tr -d '[:space:]' < custom/upstream/build-firmware.yml.sha 2>/dev/null || true)"
          current="$(git rev-parse parent/master:.github/workflows/build-firmware.yml 2>/dev/null || true)"
          echo "上游 build-firmware.yml blob=$current（本仓库记录的 hook 基线=$recorded）"
          if [ -n "$recorded" ] && [ -n "$current" ] && [ "$recorded" != "$current" ]; then
            echo "::warning::naoki66 更新了 .github/workflows/build-firmware.yml，本仓库仍用自己的定制版，需要手工把上游新改动合进来"
          fi

      - name: Push to origin
        if: steps.merge.outputs.changed == 'true'
        run: git push origin HEAD:master

      - name: Trigger firmware build
        if: ${{ steps.merge.outputs.changed == 'true' && (github.event_name == 'schedule' || github.event.inputs.trigger_build != 'false') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh workflow run build-firmware.yml --repo "${{ github.repository }}" --ref master -f release_type=release; then
            echo "已触发固件构建：Build XR1710G Firmware"
          else
            echo "::warning::自动触发构建失败，请手动运行 Build XR1710G Firmware"
          fi

      - name: Show result
        if: always()
        run: |
          echo "=== Sync Result ==="
          echo "本次已合并：${{ steps.merge.outputs.merged }}"
          echo "因冲突跳过：${{ steps.merge.outputs.skipped }}"
          git log --oneline -5 || true
          git status --short || true
